<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 24" shape-rendering="crispEdges">
  <!-- original GBA-style character sprite: black hair, navy pinstripe jacket, olive shirt -->
  <!-- hair -->
  <rect x="5" y="0" width="6" height="1" fill="#111111"/>
  <rect x="4" y="1" width="8" height="1" fill="#111111"/>
  <rect x="3" y="2" width="10" height="1" fill="#111111"/>
  <rect x="3" y="3" width="10" height="1" fill="#1c1c1c"/>
  <rect x="2" y="4" width="12" height="1" fill="#111111"/>
  <rect x="2" y="5" width="12" height="1" fill="#1c1c1c"/>
  <!-- face row with bangs -->
  <rect x="2" y="6" width="2" height="1" fill="#111111"/>
  <rect x="4" y="6" width="1" height="1" fill="#f0c8a0"/>
  <rect x="5" y="6" width="2" height="1" fill="#111111"/>
  <rect x="7" y="6" width="2" height="1" fill="#f0c8a0"/>
  <rect x="9" y="6" width="2" height="1" fill="#111111"/>
  <rect x="11" y="6" width="1" height="1" fill="#f0c8a0"/>
  <rect x="12" y="6" width="2" height="1" fill="#111111"/>
  <!-- face -->
  <rect x="2" y="7" width="1" height="1" fill="#111111"/>
  <rect x="3" y="7" width="10" height="1" fill="#f0c8a0"/>
  <rect x="13" y="7" width="1" height="1" fill="#111111"/>
  <!-- eyes row -->
  <rect x="2" y="8" width="1" height="1" fill="#111111"/>
  <rect x="3" y="8" width="1" height="1" fill="#f0c8a0"/>
  <rect x="4" y="8" width="2" height="1" fill="#2a2a2a"/>
  <rect x="6" y="8" width="4" height="1" fill="#f0c8a0"/>
  <rect x="10" y="8" width="2" height="1" fill="#2a2a2a"/>
  <rect x="12" y="8" width="1" height="1" fill="#f0c8a0"/>
  <rect x="13" y="8" width="1" height="1" fill="#111111"/>
  <!-- cheeks / mouth -->
  <rect x="3" y="9" width="10" height="1" fill="#f0c8a0"/>
  <rect x="4" y="10" width="8" height="1" fill="#f0c8a0"/>
  <rect x="7" y="10" width="2" height="1" fill="#d89f78"/>
  <!-- chin + neck -->
  <rect x="5" y="11" width="6" height="1" fill="#f0c8a0"/>
  <rect x="6" y="12" width="4" height="1" fill="#e0b58c"/>
  <!-- shoulders / jacket -->
  <rect x="3" y="13" width="10" height="1" fill="#1e2440"/>
  <rect x="2" y="14" width="12" height="1" fill="#1e2440"/>
  <!-- arms + torso with olive shirt -->
  <rect x="2" y="15" width="2" height="1" fill="#1e2440"/>
  <rect x="4" y="15" width="2" height="1" fill="#2a3154"/>
  <rect x="6" y="15" width="4" height="1" fill="#7a805a"/>
  <rect x="10" y="15" width="2" height="1" fill="#2a3154"/>
  <rect x="12" y="15" width="2" height="1" fill="#1e2440"/>
  <rect x="2" y="16" width="2" height="1" fill="#1e2440"/>
  <rect x="4" y="16" width="2" height="1" fill="#2a3154"/>
  <rect x="6" y="16" width="4" height="1" fill="#7a805a"/>
  <rect x="10" y="16" width="2" height="1" fill="#2a3154"/>
  <rect x="12" y="16" width="2" height="1" fill="#1e2440"/>
  <rect x="2" y="17" width="2" height="1" fill="#1e2440"/>
  <rect x="4" y="17" width="8" height="1" fill="#2a3154"/>
  <rect x="12" y="17" width="2" height="1" fill="#1e2440"/>
  <!-- hands -->
  <rect x="2" y="18" width="1" height="1" fill="#f0c8a0"/>
  <rect x="3" y="18" width="10" height="1" fill="#1e2440"/>
  <rect x="13" y="18" width="1" height="1" fill="#f0c8a0"/>
  <!-- legs -->
  <rect x="4" y="19" width="3" height="1" fill="#3a3f57"/>
  <rect x="9" y="19" width="3" height="1" fill="#3a3f57"/>
  <rect x="4" y="20" width="3" height="1" fill="#3a3f57"/>
  <rect x="9" y="20" width="3" height="1" fill="#3a3f57"/>
  <rect x="4" y="21" width="3" height="1" fill="#32364a"/>
  <rect x="9" y="21" width="3" height="1" fill="#32364a"/>
  <!-- shoes -->
  <rect x="3" y="22" width="4" height="1" fill="#111111"/>
  <rect x="9" y="22" width="4" height="1" fill="#111111"/>
  <rect x="3" y="23" width="4" height="1" fill="#111111"/>
  <rect x="9" y="23" width="4" height="1" fill="#111111"/>
</svg>
